[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-insights"
version = "0.1.0"
description = "Analyse de la performance des vendeurs Olist : KPIs, prédiction du risque de chute de satisfaction, explications par LLM."
requires-python = ">=3.11"
# Les dépendances (versions figées) sont dans requirements.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
